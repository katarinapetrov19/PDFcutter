<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Poster Tile Printer</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#0d1117;color:#e2e8f0;min-height:100vh;
  padding:48px 16px 80px;display:flex;flex-direction:column;align-items:center;
}
header{text-align:center;margin-bottom:36px}
header h1{font-size:22px;font-weight:600;letter-spacing:-.02em}
header p{font-size:13px;color:#64748b;margin-top:6px}

/* paper size select */
.ps-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.ps-row span{font-size:12px;color:#64748b;white-space:nowrap}
.ps-select{
  background:#0d1117;border:1px solid #1e2535;border-radius:7px;
  color:#e2e8f0;font-size:13px;padding:8px 10px;outline:none;cursor:pointer;
  transition:border-color .14s;
}
.ps-select:focus{border-color:#3b82f6}
.custom-fields{display:flex;gap:8px;align-items:center}
.custom-fields input{
  width:72px;background:#0d1117;border:1px solid #1e2535;border-radius:7px;
  color:#e2e8f0;font-size:13px;padding:8px 10px;outline:none;
  transition:border-color .14s;
}
.custom-fields input:focus{border-color:#3b82f6}
.custom-fields span{font-size:12px;color:#3d4f6b}

.card{
  width:100%;max-width:620px;background:#161b27;
  border:1px solid #1e2535;border-radius:14px;padding:24px;margin-bottom:14px;
}
.lbl{
  font-size:11px;font-weight:600;text-transform:uppercase;
  letter-spacing:.08em;color:#3d4f6b;margin-bottom:14px;
}

/* drop zone */
.dz{
  border:2px dashed #1e2535;border-radius:10px;padding:28px 20px 20px;
  text-align:center;transition:border-color .18s,background .18s;
  pointer-events:none; /* drag events handled by wrapper */
}
.dz-wrap{cursor:pointer;border-radius:10px;}
.dz-wrap:hover .dz,.dz-wrap.over .dz{border-color:#3b82f6;background:rgba(59,130,246,.06)}
.dz svg{width:28px;height:28px;stroke:#3d4f6b;margin-bottom:10px}
.dz-main{font-size:14px;color:#94a3b8;margin-bottom:10px}
.dz-main b{color:#e2e8f0}
.dz-sub{font-size:12px;color:#3d4f6b;margin-top:4px}
.dz-file{font-size:13px;color:#3b82f6;margin-top:10px;font-weight:500;min-height:18px}
.dz-btn{
  display:inline-block;margin-top:4px;
  padding:7px 18px;background:#3b82f6;color:#fff;
  border:none;border-radius:7px;font-size:13px;font-weight:500;
  cursor:pointer;pointer-events:all;
}
.dz-btn:hover{background:#2563eb}

/* settings */
.fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-items:end}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:#64748b}
.field input{
  background:#0d1117;border:1px solid #1e2535;border-radius:7px;
  color:#e2e8f0;font-size:14px;padding:9px 10px;outline:none;
  transition:border-color .14s;width:100%;
}
.field input:focus{border-color:#3b82f6}
.opt-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.opt-row span{font-size:12px;color:#64748b;white-space:nowrap}
.segs{display:flex;background:#0d1117;border:1px solid #1e2535;border-radius:7px;overflow:hidden}
.segs button{
  padding:7px 16px;background:none;border:none;
  color:#64748b;font-size:13px;cursor:pointer;
  transition:background .14s,color .14s;
}
.segs button.on{background:#3b82f6;color:#fff}

/* preview */
.pv-box{
  background:#0d1117;border-radius:10px;padding:16px;min-height:180px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.pv-empty{font-size:13px;color:#3d4f6b;text-align:center}
#pvc{display:none;max-width:100%;border-radius:4px}
.tile-info{font-size:12px;color:#64748b;margin-top:10px;text-align:center}
.tile-info b{color:#e2e8f0}
.tile-warn{color:#f59e0b}

/* export */
.btn-row{display:flex;gap:10px}
.btn{
  flex:1;padding:11px 16px;border-radius:8px;font-size:14px;
  font-weight:500;cursor:pointer;border:none;
  transition:opacity .14s,transform .1s;text-align:center;
}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:not(:disabled):hover{opacity:.82}
.btn:not(:disabled):active{transform:scale(.98)}
.btn-blue{background:#3b82f6;color:#fff}
.btn-ghost{background:#161b27;border:1px solid #1e2535;color:#e2e8f0}

.prog{display:none;flex-direction:column;gap:7px;margin-top:14px}
.prog.show{display:flex}
.prog-track{background:#0d1117;border-radius:4px;height:5px;overflow:hidden}
.prog-fill{height:100%;background:#3b82f6;border-radius:4px;width:0%;transition:width .15s}
.prog-text{font-size:12px;color:#4b5875;text-align:center}
</style>
</head>
<body>

<header>
  <h1>Poster Tile Printer</h1>
  <p>Tile a large PDF or image into sheets for large-format poster printing</p>
</header>

<!-- hidden file input — lives outside everything -->
<input type="file" id="fi" accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff" style="display:none">

<!-- 1 · Source -->
<div class="card">
  <div class="lbl">Source file</div>
  <div class="dz-wrap" id="dzwrap">
    <div class="dz" id="dz">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242M12 12v9m-4-4 4 4 4-4"/>
      </svg>
      <div class="dz-main"><b>Drag &amp; drop</b> a file here, or</div>
      <button class="dz-btn" id="pickBtn" type="button">Choose file</button>
      <div class="dz-sub" style="margin-top:10px">PDF · PNG · JPG · TIFF</div>
      <div class="dz-file" id="fn"></div>
    </div>
  </div>
</div>

<!-- 2 · Dimensions -->
<div class="card">
  <div class="lbl">Print size</div>

  <!-- paper size picker -->
  <div class="ps-row">
    <span>Tile size</span>
    <select id="psize" class="ps-select">
      <option value="A4">A4  — 210 × 297 mm</option>
      <option value="A3">A3  — 297 × 420 mm</option>
      <option value="A2">A2  — 420 × 594 mm</option>
      <option value="A1">A1  — 594 × 841 mm</option>
      <option value="letter">Letter  — 216 × 279 mm</option>
      <option value="legal">Legal  — 216 × 356 mm</option>
      <option value="tabloid">Tabloid  — 279 × 432 mm</option>
      <option value="custom">Custom…</option>
    </select>
    <div class="custom-fields" id="customFields" style="display:none">
      <input type="number" id="csw" placeholder="W" min="50" max="2000" value="210">
      <span>×</span>
      <input type="number" id="csh" placeholder="H" min="50" max="2000" value="297">
      <span>mm</span>
    </div>
  </div>

  <div class="fields">
    <div class="field"><label>Width</label><input type="number" id="pw" value="200" min="1" step="1"></div>
    <div class="field"><label>Height</label><input type="number" id="ph" value="200" min="1" step="1"></div>
    <div class="field"><label>Overlap (mm)</label><input type="number" id="ov" value="10" min="0" max="50" step="1"></div>
  </div>
  <div class="opt-row">
    <span>Unit</span>
    <div class="segs">
      <button class="on" id="ucm" type="button">cm</button>
      <button id="um" type="button">m</button>
    </div>
    <span>Orientation</span>
    <div class="segs">
      <button class="on" id="opo" type="button">Portrait</button>
      <button id="ola" type="button">Landscape</button>
    </div>
  </div>
</div>

<!-- 3 · Preview -->
<div class="card">
  <div class="lbl">Tiling preview</div>
  <div class="pv-box">
    <div class="pv-empty" id="pvemp">Upload a file and set dimensions to preview the tile grid</div>
    <canvas id="pvc"></canvas>
  </div>
  <div class="tile-info" id="tinfo"></div>
</div>

<!-- 4 · Export -->
<div class="card">
  <div class="lbl">Export</div>
  <div class="btn-row">
    <button class="btn btn-blue"  id="bpdf" type="button" disabled>Multi-page PDF</button>
    <button class="btn btn-ghost" id="bzip" type="button" disabled>ZIP of tiles</button>
  </div>
  <div class="prog" id="prog">
    <div class="prog-track"><div class="prog-fill" id="pfill"></div></div>
    <div class="prog-text" id="ptxt"></div>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ── constants ──────────────────────────────────────────────────────────────
const RDPI   = 150;
const PXmm   = RDPI / 25.4;
const MAXSRC = 7000;

// paper size catalogue [short, long] in mm
const PAPER = {
  A4:      [210, 297],
  A3:      [297, 420],
  A2:      [420, 594],
  A1:      [594, 841],
  letter:  [216, 279],
  legal:   [216, 356],
  tabloid: [279, 432],
};

// ── state ──────────────────────────────────────────────────────────────────
let srcCanvas  = null;
let unit       = 'cm';
let orient     = 'portrait';
let paperKey   = 'A4';       // key into PAPER or 'custom'
let customW    = 210;        // mm, used when paperKey === 'custom'
let customH    = 297;
let pvTimer    = null;

function paperShort() { return paperKey === 'custom' ? Math.min(customW, customH) : PAPER[paperKey][0] }
function paperLong()  { return paperKey === 'custom' ? Math.max(customW, customH) : PAPER[paperKey][1] }
const tw   = () => orient === 'portrait' ? paperShort() : paperLong();
const th   = () => orient === 'portrait' ? paperLong()  : paperShort();
const tpxW = () => Math.round(tw() * PXmm);
const tpxH = () => Math.round(th() * PXmm);

// jsPDF format value
function jsPDFFormat() {
  if (paperKey !== 'custom') return paperKey === 'tabloid' ? 'tabloid' : paperKey.toLowerCase();
  return [tw(), th()]; // custom: pass [w, h] in mm
}

// ── DOM refs ───────────────────────────────────────────────────────────────
const fi      = document.getElementById('fi');
const dzwrap  = document.getElementById('dzwrap');
const fnEl    = document.getElementById('fn');
const pvempEl = document.getElementById('pvemp');
const pvcEl   = document.getElementById('pvc');
const tinfoEl = document.getElementById('tinfo');
const bpdf    = document.getElementById('bpdf');
const bzip    = document.getElementById('bzip');
const progEl  = document.getElementById('prog');
const pfill   = document.getElementById('pfill');
const ptxt    = document.getElementById('ptxt');

// ── file picker button ─────────────────────────────────────────────────────
document.getElementById('pickBtn').addEventListener('click', function(e) {
  e.stopPropagation();
  fi.value = '';       // reset so same file can be re-selected
  fi.click();
});

// ── drag and drop on the wrapper ───────────────────────────────────────────
dzwrap.addEventListener('dragover',  e => { e.preventDefault(); dzwrap.classList.add('over') });
dzwrap.addEventListener('dragleave', e => { if (!dzwrap.contains(e.relatedTarget)) dzwrap.classList.remove('over') });
dzwrap.addEventListener('drop', e => {
  e.preventDefault();
  dzwrap.classList.remove('over');
  const file = e.dataTransfer.files[0];
  if (file) handleFile(file);
});

// ── file input change ──────────────────────────────────────────────────────
fi.addEventListener('change', function() {
  if (this.files && this.files[0]) handleFile(this.files[0]);
});

// ── load file ─────────────────────────────────────────────────────────────
async function handleFile(file) {
  fnEl.style.color = '#3b82f6';
  fnEl.textContent = '⏳ Loading ' + file.name + '…';
  try {
    const n = file.name.toLowerCase();
    if (n.endsWith('.pdf') || file.type === 'application/pdf') {
      srcCanvas = await loadPDF(file);
    } else if (n.endsWith('.tif') || n.endsWith('.tiff')) {
      srcCanvas = await loadTIFF(file);
    } else {
      srcCanvas = await loadImage(file);
    }
    fnEl.textContent = '✓ ' + file.name;
    refreshPreview();
  } catch(err) {
    fnEl.style.color = '#f87171';
    fnEl.textContent = '✗ ' + err.message;
  }
}

async function loadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.naturalWidth, h = img.naturalHeight;
      const s = Math.min(1, MAXSRC / Math.max(w, h));
      w = Math.round(w * s); h = Math.round(h * s);
      const c = makeCanvas(w, h);
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(c);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Image failed to load')) };
    img.src = url;
  });
}

async function loadTIFF(file) {
  const buf  = await file.arrayBuffer();
  const ifds = UTIF.decode(buf);
  if (!ifds.length) throw new Error('No pages found in TIFF');
  UTIF.decodeImage(buf, ifds[0]);
  const ifd  = ifds[0];
  const w = ifd.width, h = ifd.height;
  const rgba = UTIF.toRGBA8(ifd);
  const tmp  = makeCanvas(w, h);
  const id   = tmp.getContext('2d').createImageData(w, h);
  id.data.set(rgba);
  tmp.getContext('2d').putImageData(id, 0, 0);
  const s = Math.min(1, MAXSRC / Math.max(w, h));
  const dw = Math.round(w * s), dh = Math.round(h * s);
  const c = makeCanvas(dw, dh);
  c.getContext('2d').drawImage(tmp, 0, 0, dw, dh);
  return c;
}

async function loadPDF(file) {
  const buf  = await file.arrayBuffer();
  const pdf  = await pdfjsLib.getDocument({ data: buf }).promise;
  const page = await pdf.getPage(1);
  const vp0  = page.getViewport({ scale: 1 });
  const sc   = Math.min(3, MAXSRC / Math.max(vp0.width, vp0.height));
  const vp   = page.getViewport({ scale: sc });
  const c    = makeCanvas(Math.round(vp.width), Math.round(vp.height));
  const ctx  = c.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, c.width, c.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  return c;
}

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

// ── settings controls ──────────────────────────────────────────────────────
document.getElementById('pw').addEventListener('input', schedPreview);
document.getElementById('ph').addEventListener('input', schedPreview);
document.getElementById('ov').addEventListener('input', schedPreview);

document.getElementById('ucm').addEventListener('click', () => setUnit('cm'));
document.getElementById('um').addEventListener('click',  () => setUnit('m'));
document.getElementById('opo').addEventListener('click', () => setOrient('portrait'));
document.getElementById('ola').addEventListener('click', () => setOrient('landscape'));

document.getElementById('psize').addEventListener('change', function() {
  paperKey = this.value;
  document.getElementById('customFields').style.display = paperKey === 'custom' ? 'flex' : 'none';
  schedPreview();
});
document.getElementById('csw').addEventListener('input', function() {
  customW = Math.max(1, +this.value || 210);
  schedPreview();
});
document.getElementById('csh').addEventListener('input', function() {
  customH = Math.max(1, +this.value || 297);
  schedPreview();
});

function setUnit(u) {
  unit = u;
  document.getElementById('ucm').classList.toggle('on', u === 'cm');
  document.getElementById('um').classList.toggle('on',  u === 'm');
  schedPreview();
}

function setOrient(o) {
  orient = o;
  document.getElementById('opo').classList.toggle('on', o === 'portrait');
  document.getElementById('ola').classList.toggle('on', o === 'landscape');
  schedPreview();
}

// ── grid calc ──────────────────────────────────────────────────────────────
function getW()   { return +document.getElementById('pw').value * (unit === 'm' ? 1000 : 10) }
function getH()   { return +document.getElementById('ph').value * (unit === 'm' ? 1000 : 10) }
function getOvl() { return +document.getElementById('ov').value }

function calcGrid() {
  const w = getW(), h = getH(), o = getOvl();
  if (!w || !h) return null;
  const tilew = tw(), tileh = th();
  const sx = tilew - o, sy = tileh - o;
  if (sx <= 0 || sy <= 0) return null;
  return {
    cols: Math.ceil(w / sx), rows: Math.ceil(h / sy),
    sx, sy, w, h, tilew, tileh
  };
}

// ── preview ────────────────────────────────────────────────────────────────
function schedPreview() { clearTimeout(pvTimer); pvTimer = setTimeout(refreshPreview, 180) }

function refreshPreview() {
  if (!srcCanvas) return;
  const g = calcGrid();
  if (!g) return;

  const MAX = 560;
  const ar  = srcCanvas.width / srcCanvas.height;
  const pw  = ar >= 1 ? MAX : Math.round(MAX * ar);
  const ph  = ar >= 1 ? Math.round(MAX / ar) : MAX;

  pvcEl.width  = pw;
  pvcEl.height = ph;
  const ctx = pvcEl.getContext('2d');
  ctx.drawImage(srcCanvas, 0, 0, pw, ph);

  const stpX = g.sx     / g.w * pw;
  const stpY = g.sy     / g.h * ph;
  const tpw  = g.tilew  / g.w * pw;
  const tph  = g.tileh  / g.h * ph;
  const fs   = Math.max(7, Math.min(13, Math.floor(Math.min(stpX, stpY) / 5)));

  ctx.font         = `bold ${fs}px -apple-system,sans-serif`;
  ctx.textBaseline = 'top';

  for (let r = 0; r < g.rows; r++) {
    for (let c = 0; c < g.cols; c++) {
      const x  = c * stpX, y = r * stpY;
      const bw = Math.min(tpw, pw - x), bh = Math.min(tph, ph - y);
      ctx.fillStyle   = 'rgba(59,130,246,.1)';
      ctx.fillRect(x, y, bw, bh);
      ctx.strokeStyle = 'rgba(59,130,246,.75)';
      ctx.lineWidth   = 1;
      ctx.strokeRect(x + .5, y + .5, bw - 1, bh - 1);
      ctx.fillStyle   = 'rgba(59,130,246,.9)';
      ctx.fillText(tileLabel(r, c), x + 3, y + 3);
    }
  }

  pvempEl.style.display = 'none';
  pvcEl.style.display   = 'block';

  const n    = g.cols * g.rows;
  const warn = n > 200;
  tinfoEl.innerHTML =
    `<b class="${warn ? 'tile-warn' : ''}">${n} tile${n !== 1 ? 's' : ''}</b>`
    + ` &nbsp;—&nbsp; ${g.cols} col${g.cols !== 1 ? 's' : ''} × ${g.rows} row${g.rows !== 1 ? 's' : ''}`
    + ` &nbsp;·&nbsp; ${paperKey === 'custom' ? customW+'×'+customH+'mm' : paperKey.toUpperCase()} ${orient}`
    + (warn ? ` <span class="tile-warn">· large export, may take a while</span>` : '');

  bpdf.disabled = false;
  bzip.disabled = false;
}

function tileLabel(row, col) {
  const r = row < 26 ? String.fromCharCode(65 + row) : 'R' + (row + 1);
  return r + (col + 1);
}

// ── render one tile ────────────────────────────────────────────────────────
function renderTile(col, row, g) {
  const pw  = tpxW(), ph = tpxH();
  const c   = makeCanvas(pw, ph);
  const ctx = c.getContext('2d');

  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, pw, ph);

  const sx = srcCanvas.width  / g.w;
  const sy = srcCanvas.height / g.h;
  ctx.drawImage(
    srcCanvas,
    col * g.sx * sx, row * g.sy * sy,
    g.tilew * sx,    g.tileh * sy,
    0, 0, pw, ph
  );

  // label badge
  const lbl  = tileLabel(row, col);
  const fs   = 20, pad = 8;
  ctx.font         = `bold ${fs}px -apple-system,Helvetica,sans-serif`;
  ctx.textBaseline = 'top';
  const lblW = ctx.measureText(lbl).width;
  const badgeW = lblW + pad * 2, badgeH = fs + pad * 2 + 2;
  ctx.fillStyle = 'rgba(0,0,0,.42)';
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(6, 6, badgeW, badgeH, 5) : ctx.rect(6, 6, badgeW, badgeH);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillText(lbl, 6 + pad, 6 + pad);

  return c;
}

// ── export ─────────────────────────────────────────────────────────────────
bpdf.addEventListener('click', () => doExport('pdf'));
bzip.addEventListener('click', () => doExport('zip'));

async function doExport(mode) {
  if (!srcCanvas) return;
  const g = calcGrid();
  if (!g) return;

  const total = g.rows * g.cols;
  bpdf.disabled = true;
  bzip.disabled = true;
  progEl.classList.add('show');
  updateProgress(0, total);

  const { jsPDF } = window.jspdf;
  let n = 0;

  if (mode === 'pdf') {
    const doc = new jsPDF({ unit: 'mm', format: jsPDFFormat(), orientation: orient });
    for (let r = 0; r < g.rows; r++) {
      for (let c = 0; c < g.cols; c++) {
        if (n > 0) doc.addPage();
        doc.addImage(renderTile(c, r, g).toDataURL('image/jpeg', .92), 'JPEG', 0, 0, g.tilew, g.tileh);
        updateProgress(++n, total);
        await tick();
      }
    }
    doc.save('poster-tiles.pdf');
  } else {
    const zip = new JSZip();
    for (let r = 0; r < g.rows; r++) {
      for (let c = 0; c < g.cols; c++) {
        const lbl = tileLabel(r, c);
        const doc = new jsPDF({ unit: 'mm', format: jsPDFFormat(), orientation: orient });
        doc.addImage(renderTile(c, r, g).toDataURL('image/jpeg', .92), 'JPEG', 0, 0, g.tilew, g.tileh);
        zip.file('tile-' + lbl + '.pdf', doc.output('arraybuffer'));
        updateProgress(++n, total);
        await tick();
      }
    }
    const blob = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'poster-tiles.zip';
    a.click();
    URL.revokeObjectURL(a.href);
  }

  pfill.style.width = '100%';
  ptxt.textContent  = 'Done!';
  setTimeout(() => {
    progEl.classList.remove('show');
    pfill.style.width = '0%';
    bpdf.disabled = false;
    bzip.disabled = false;
  }, 2000);
}

function updateProgress(n, total) {
  pfill.style.width = Math.round(n / total * 100) + '%';
  ptxt.textContent  = 'Tile ' + n + ' of ' + total + '…';
}

const tick = () => new Promise(r => setTimeout(r, 0));
</script>
</body>
</html>
